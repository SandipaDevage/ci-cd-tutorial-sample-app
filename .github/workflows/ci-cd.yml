# CI/CD pipeline
#   CI: on every push / pull request -> install dependencies, lint, run unit tests
#   CD: only on a push to master AND only if CI passed -> deploy to Vercel
#       (staging) and then check that the new version is live.
name: CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build & Test (CI)
    runs-on: ubuntu-latest
    container: python:3.8-slim          # the app targets Python 3.8
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint (syntax errors / undefined names)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run unit tests
        run: python -m unittest discover -v

  deploy:
    name: Deploy to Staging (CD)
    needs: test                          # runs ONLY if the test job succeeded
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: staging                 # shows up under "Deployments" on GitHub
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install the Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel (staging)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set"
            exit 1
          fi
          # Creates/links the Vercel project on the first run, uploads the code,
          # waits for the build, and prints the deployment URL on stdout.
          # GIT_COMMIT is passed to the app so /health can report the tested commit.
          DEPLOY_URL=$(vercel deploy --prod --yes --token "$VERCEL_TOKEN" \
                         --env GIT_COMMIT="$GITHUB_SHA")
          echo "Deployment: $DEPLOY_URL"

          # Look up the public production domain (the shortest alias) of this deployment.
          ORG_ID=$(jq -r .orgId .vercel/project.json)
          TEAM_QS=""
          case "$ORG_ID" in team_*) TEAM_QS="?teamId=$ORG_ID" ;; esac
          ALIAS=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
                    "https://api.vercel.com/v13/deployments/${DEPLOY_URL#https://}${TEAM_QS}" \
                  | jq -r '[.alias[]?] | sort_by(length) | .[0] // empty')
          APP_URL="https://${ALIAS:-${DEPLOY_URL#https://}}"
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
          echo "Staging URL: $APP_URL"

      - name: Check the new version is live
        run: |
          echo "Checking ${APP_URL}/health ..."
          for i in $(seq 1 20); do
            BODY=$(curl -fsS --max-time 30 "${APP_URL}/health" || true)
            echo "Attempt $i: ${BODY:-no response yet}"
            if echo "$BODY" | grep -q "\"commit\": *\"${GITHUB_SHA}\""; then
              echo "Commit ${GITHUB_SHA} is live on staging: ${APP_URL}"
              {
                echo "### Deployed to staging :rocket:"
                echo "- URL: ${APP_URL}"
                echo "- Commit: ${GITHUB_SHA}"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::New version did not appear on staging in time"
          exit 1
